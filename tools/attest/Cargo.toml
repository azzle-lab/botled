[package]
name = "botled-attest"
version = "0.1.0"
edition = "2021"
description = "Verifies a NEAR AI model attestation report (Intel TDX quote via DCAP, report_data key binding, RTMR/event-log replay, compose binding) for Botled's provider_tee signer keys."
publish = false

[workspace]

[dependencies]
dcap-qvl = "=0.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
anyhow = "1"
