[package]
name = "botled-logic"
description = "Pure rules for the Botled NEAR runner registry: receipts, pricing, tickets, signup, chain-signature derivation"
version = "0.1.0"
edition = "2021"

[features]
default = []
# secp256k1 point math to check that a runner's Base address is its NEAR Chain Signatures address
derivation = ["dep:k256", "dep:sha3"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"], optional = true }
sha3 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
sha3 = "0.10"
