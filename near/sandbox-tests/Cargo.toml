[package]
name = "sandbox-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "near-workspaces sandbox gas measurements for botled-registry (local neard sandbox, nothing broadcast)"

[dependencies]

[dev-dependencies]
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
botled-logic = { path = "../botled-logic", features = ["derivation"] }
